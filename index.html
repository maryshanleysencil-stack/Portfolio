    <!-- Contact Section -->
    <section class="contact" id="contact">
        <div class="container">
            <h2>Let's Connect</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <div class="contact-info-icon"><i class="fas fa-envelope"></i></div>
                    <h3>Email</h3>
                    <p>maryshanley.sencil@gmail.com</p>
                </div>
                <div class="contact-info">
                    <div class="contact-info-icon"><i class="fas fa-phone"></i></div>
                    <h3>Phone</h3>
                    <p>+1 (555) 123-4567</p>
                </div>
                <div class="contact-info">
                    <div class="contact-info-icon"><i class="fas fa-map-marker-alt"></i></div>
                    <h3>Location</h3>
                    <p>Remote / Available Worldwide</p>
                </div>
            </div>

            <form class="contact-form" action="https://formspree.io/f/mojyeroe" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                    <span class="error">Please enter your name</span>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    <span class="error">Please enter a valid email</span>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Project Inquiry" required>
                    <span class="error">Please enter a subject</span>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" placeholder="Tell me about your project..." required></textarea>
                    <span class="error">Please enter your message</span>
                </div>
                <button type="submit" class="btn">Send Message</button>
                <div class="form-message" id="formMessage"></div>
            </form>
        </div>
    </section>
