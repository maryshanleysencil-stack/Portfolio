<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shanley VA</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAV -->
<nav>
    <h3>Shanley VA</h3>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>I help businesses thrive online</h1>
</section>

<!-- PORTFOLIO -->
<section id="portfolio">
    <h2 class="section-title">Portfolio</h2>

    <div class="portfolio-grid">

        <div class="portfolio-item">
            <img src="https://images.unsplash.com/photo-1460925895917-adf4198c838f">
            <div class="portfolio-overlay">
                <h3>Instagram Growth</h3>
                <p>250% growth in 3 months</p>
            </div>
        </div>

        <div class="portfolio-item">
            <img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643">
            <div class="portfolio-overlay">
                <h3>Content Strategy</h3>
                <p>150+ posts planned</p>
            </div>
        </div>

    </div>
</section>

<!-- CONTACT -->
<section class="contact" id="contact">

    <form class="contact-form" action="https://formspree.io/f/mojyeroe" method="POST">
        
        <h2>Let's Connect</h2>

        <label>Your Name</label>
        <input type="text" name="name" placeholder="John Doe" required>

        <label>Your Email</label>
        <input type="email" name="email" placeholder="john@example.com" required>

        <label>Subject</label>
        <input type="text" name="subject" placeholder="Project Inquiry" required>

        <label>Your Message</label>
        <textarea name="message" placeholder="Tell me about your project..." required></textarea>

        <button type="submit">Send Message</button>

    </form>

</section>

</body>
</html>
